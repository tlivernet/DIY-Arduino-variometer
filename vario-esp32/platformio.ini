; Variomètre ESP32-S3 — configuration PlatformIO
;
; Le coeur métier (src/core) est du C++17 pur, sans dépendance Arduino :
; il se compile et se teste sur PC.
;
;   pio test -e native      lance les tests unitaires du coeur
;   pio run  -e esp32s3     compile le firmware embarqué

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; Options communes à toutes les cibles.
; ---------------------------------------------------------------------------
[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc
    ; isnan() et isfinite() sont la première ligne de défense du filtre :
    ; -ffast-math implique -ffinite-math-only, qui autorise le compilateur à
    ; considérer ces tests comme toujours faux et donc à les SUPPRIMER.
    -fno-fast-math
    -fno-finite-math-only

; INDISPENSABLE, et l'oublier coûte une heure de diagnostic.
;
; Le coeur Arduino-ESP32 ajoute -std=gnu++11 à sa propre liste d'options, et
; comme celle-ci arrive APRÈS build_flags sur la ligne de commande, c'est elle
; qui gagne : gcc retient le dernier -std rencontré. Le firmware se compilait
; donc en C++11 malgré le -std=gnu++17 ci-dessus.
;
; Conséquence concrète : en C++11, une structure dotée d'initialiseurs de
; membres par défaut n'est PAS un agrégat. Toute initialisation de la forme
; ToneOutput{true, 690} est alors interprétée comme un appel de constructeur et
; échoue. Le message d'erreur ne mentionne à aucun moment la version du
; langage, d'où la difficulté.
;
; core/clock.h porte un static_assert qui rattrape le cas avec un message
; explicite si cette ligne disparaît.
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------------------
; Tests unitaires du coeur métier, exécutés sur la machine de développement.
; build_src_filter ne retient que src/core : le reste dépend d'Arduino.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = +<core/>
build_flags =
    ${env.build_flags}
    -Werror

; ---------------------------------------------------------------------------
; Cible embarquée.
; La carte de référence est une Waveshare ESP32-S3-Zero ; elle n'a pas de
; définition dédiée dans PlatformIO, la esp32-s3-devkitc-1 est électriquement
; équivalente pour ce qui nous concerne (ESP32-S3, USB natif).
; Pas de partition OTA : on flashe par USB, et la place gagnée sert au
; journal de vol LittleFS et à l'IHM web.
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_no_ota.csv
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
